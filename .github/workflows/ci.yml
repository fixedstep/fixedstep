name: CI

on:
  pull_request:
  # Pushes to main and v* tags run this from deploy.yml (check → deploy), so it runs once.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm content:validate
      - run: pnpm --filter @fixedstep/web build

  e2e:
    runs-on: ubuntu-latest
    # The apt deps step (playwright install --with-deps) took up to ~11.5 min on a slow runner.
    timeout-minutes: 25
    # Non-blocking until it has been reliably green on main; see CLAUDE.md "Running checks".
    continue-on-error: true
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixedstep
          POSTGRES_PASSWORD: fixedstep
          POSTGRES_DB: fixedstep
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixedstep" --health-interval 2s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pw
        run: echo "version=$(node -p "JSON.parse(require('fs').readFileSync('e2e/node_modules/@playwright/test/package.json')).version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      # Always runs: on a cache hit it skips the download but still installs the apt deps.
      - run: pnpm --filter @fixedstep/e2e exec playwright install --with-deps --only-shell chromium
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          retention-days: 7
          # Otherwise the hidden e2e/.output (the API log) is skipped.
          include-hidden-files: true
          path: |
            e2e/playwright-report
            e2e/test-results
            e2e/.output
