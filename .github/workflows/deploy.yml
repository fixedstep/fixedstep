name: Deploy

# main → staging (automatic); v* tag → prod (requires approval on the `production`
# environment: Settings → Environments → production → Required reviewers).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Native arm64 runner: the API image and Lambdas are arm64 (Graviton), no QEMU needed.
    runs-on: ubuntu-24.04-arm
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    concurrency: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm --filter @fixedstep/web build
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fixedstep-${{ env.STAGE }}-github-deployer
          aws-region: us-east-1
      - run: pnpm cdk deploy -c stage=${{ env.STAGE }} --all --require-approval never
