name: Deploy

# main → staging (automatic); v* tag → prod (requires approval on the `production`
# environment: Settings → Environments → production → Required reviewers).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # Skipped until the DEPLOY_ENABLED repo variable is "true". The GCP_* and PULUMI_* values
    # are set per GitHub environment (each stage is its own project); see README "Deploying".
    if: vars.DEPLOY_ENABLED == 'true'
    # amd64: Cloud Run runs linux/amd64 images.
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    concurrency: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - uses: docker/setup-buildx-action@v3
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.STAGE }}
          work-dir: infra
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
