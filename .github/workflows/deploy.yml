name: Deploy

# main → staging (automatic); v* tag → prod (requires approval on the `production`
# environment: Settings → Environments → production → Required reviewers).
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  id-token: write
  contents: read

jobs:
  # The full CI checks (lint, typecheck, tests, content, web build), once, before deploying.
  check:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: check
    # Skipped until the DEPLOY_ENABLED repo variable is "true". Each GitHub environment says which
    # cloud its stage runs on (CLOUD = gcp | aws) and holds that cloud's variables; see README
    # "Deploying".
    if: vars.DEPLOY_ENABLED == 'true'
    # amd64: Cloud Run and Fargate both run linux/amd64 images here.
    runs-on: ubuntu-24.04
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging' }}
    concurrency: deploy-${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
      CLOUD: ${{ vars.CLOUD }}
    steps:
      - if: env.CLOUD != 'gcp' && env.CLOUD != 'aws'
        run: |
          echo "Set the CLOUD variable (gcp or aws) on the GitHub environment" >&2
          exit 1
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: env.CLOUD == 'gcp'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}
      - if: env.CLOUD == 'aws'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-duration-seconds: 7200
      # When the cloud rejects GitHub's OIDC token, show the claims it was matched on.
      - if: failure()
        name: Show OIDC token claims
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r .value | cut -d. -f2 \
            | python3 -c 'import base64, json, sys; p = sys.stdin.read().strip(); c = json.loads(base64.urlsafe_b64decode(p + "=" * (-len(p) % 4))); print(json.dumps({k: c.get(k) for k in ("iss", "aud", "sub", "repository", "environment", "ref")}, indent=2))'
      - uses: docker/setup-buildx-action@v3
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: ${{ env.CLOUD }}-${{ env.STAGE }}
          work-dir: infra
          cloud-url: ${{ vars.PULUMI_BACKEND_URL }}
        env:
          PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
