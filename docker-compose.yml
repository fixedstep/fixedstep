name: fixedstep

# Local development stack.
#   docker compose up                      # postgres + api (:3000) + web (:5173), hot reload
#   docker compose run --rm api pnpm content:sync   # loads $CONTENT_DIR (default content-sample)
#   docker compose --profile prod up api-prod   # production images (API + SPA + grader) on :3001

x-node: &node
  build:
    context: docker # the dev image needs no source files; they're bind-mounted
    dockerfile: dev.Dockerfile
  image: fixedstep-dev:latest
  # Run as your host user so files written to the bind mount (node_modules, dist) stay yours.
  user: "${UID:-1000}:${GID:-1000}"
  # Mounted at the same absolute path as on the host, so node_modules (which records the absolute
  # .pnpm-store path) is valid for both host and container pnpm. Run compose from the repo root.
  working_dir: ${PWD}
  volumes:
    - .:${PWD}
    # CONTENT_DIR (from .env) may live outside the repo, e.g. the private content repo checked
    # out next to it, so it's mounted separately and the container reads it from /content.
    - ${CONTENT_DIR:-./content-sample}:/content
  environment: &node-env
    HOME: ${PWD}/.cache/docker-home
    # Overrides .env (Node's --env-file never overwrites variables that are already set).
    DATABASE_URL: postgres://fixedstep:fixedstep@postgres:5432/fixedstep
    CONTENT_DIR: /content

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fixedstep
      POSTGRES_PASSWORD: fixedstep
      POSTGRES_DB: fixedstep
    ports:
      # Localhost only: this dev password is public, so don't expose the DB to the network.
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixedstep"]
      interval: 2s
      timeout: 5s
      retries: 20

  # One-shot: keeps node_modules in sync with the lockfile before the servers start.
  # confirmModulesPurge=false: a one-time reinstall if node_modules predates the shared store.
  deps:
    <<: *node
    command: >-
      sh -c '[ -f pnpm-workspace.yaml ] || { echo "run docker compose from the repo root"; exit 1; };
      pnpm install --frozen-lockfile --config.confirmModulesPurge=false'

  api:
    <<: *node
    command: pnpm --filter @fixedstep/api dev
    ports:
      - "3000:3000"
    depends_on:
      deps:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    <<: *node
    command: pnpm --filter @fixedstep/web dev --host 0.0.0.0
    environment:
      <<: *node-env
      API_PROXY_TARGET: http://api:3000
    ports:
      - "5173:5173"
    depends_on:
      deps:
        condition: service_completed_successfully
      api:
        condition: service_started

  # The production images (apps/api/Dockerfile serves API + SPA; apps/grader/Dockerfile) against
  # the local database, wired the way they're deployed.
  api-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: fixedstep-api:local
    env_file: .env
    environment:
      DATABASE_URL: postgres://fixedstep:fixedstep@postgres:5432/fixedstep
      BETTER_AUTH_URL: http://localhost:3001
      WEB_ORIGIN: http://localhost:3001
      GRADER_MODE: http
      GRADER_URL: http://grader-prod:3001
      GRADER_TOKEN: &grader-token local-grader-token-not-a-secret-000000
      CONTENT_SYNC_TOKEN: local-content-token-not-a-secret-00000
    ports:
      - "3001:3000"
    depends_on:
      postgres:
        condition: service_healthy
      grader-prod:
        condition: service_started

  grader-prod:
    profiles: [prod]
    build:
      context: .
      dockerfile: apps/grader/Dockerfile
    image: fixedstep-grader:local
    environment:
      GRADER_TOKEN: *grader-token

volumes:
  pgdata:
