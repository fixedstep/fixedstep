services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: fixedstep
      POSTGRES_PASSWORD: fixedstep
      POSTGRES_DB: fixedstep
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fixedstep"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  pgdata:
