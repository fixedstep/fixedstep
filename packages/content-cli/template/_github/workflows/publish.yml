# Validates every lesson (solutions must pass their tests in the production QuickJS grader),
# bundles, and uploads. Upload triggers the in-VPC sync Lambda. This repo never holds DB
# credentials. Set AWS_ACCOUNT_ID as an *environment* variable on `staging` and `production`
# (one account each).
#
# PLATFORM_REF pins the platform version that validates and bundles this content, so a schema
# change in the platform can't break publishing without warning. Bump it in a PR; the PR run
# validates against the new version before anything ships.
name: Publish content

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  id-token: write
  contents: read

env:
  PLATFORM_REF: {{PLATFORM_REF}}

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && '' || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
    env:
      STAGE: ${{ startsWith(github.ref, 'refs/tags/v') && 'prod' || 'staging' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: content
      - uses: actions/checkout@v4
        with:
          repository: fixedstep/fixedstep
          ref: ${{ env.PLATFORM_REF }}
          path: platform
          # Only needed while the platform repo is private: a fine-grained token with
          # read-only Contents access to it, stored as a secret in this repo.
          # token: ${{ secrets.PLATFORM_REPO_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: platform/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: platform/.nvmrc
      - run: pnpm install --frozen-lockfile
        working-directory: platform
      - name: Validate and bundle
        working-directory: platform
        run: pnpm --filter @fixedstep/content-cli start bundle "$GITHUB_WORKSPACE/content" "$GITHUB_WORKSPACE/bundle.json"
      - if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/fixedstep-${{ env.STAGE }}-github-content-publisher
          aws-region: us-east-1
      - if: github.event_name != 'pull_request'
        run: |
          aws s3 cp bundle.json \
            "s3://fixedstep-${STAGE}-content-bundles-${{ vars.AWS_ACCOUNT_ID }}/bundles/${GITHUB_SHA}.json"
